<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#162b43}.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657b}.zh{font-size:23px;font-weight:600}.en{font-size:17px;fill:#405b76}.small{font-size:17px;fill:#52657b}.label{font-size:18px;font-weight:600}.line{fill:none;stroke:#52657b;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round}.note{font-size:16px;fill:#52657b}</style>
<rect width="1200" height="820" rx="24" fill="#f5f8fc"/>
<title id="title">独立验收循环 / Independent review cycle</title><desc id="desc">执行当前项并提交证据，验收不通过时定向修复，逐项通过后再进行整体验收。Execute, submit evidence, repair gaps, then review the whole goal.</desc>
<text x="48" y="60" class="title" text-anchor="start">02 / 从执行到验收 · From execution to review</text>
<text x="48" y="94" class="subtitle" text-anchor="start">独立验收开启时 · When independent review is enabled</text>
<rect x="45" y="185" width="260" height="90" rx="16" fill="#ffffff" stroke="#d2deed" stroke-width="1.5"/>
<text x="175.0" y="220" class="zh" text-anchor="middle">制定固定计划</text>
<text x="175.0" y="247" class="en" text-anchor="middle">Structured plan.md</text>
<path d="M305 230 H355" class="line"/>
<rect x="355" y="185" width="260" height="90" rx="16" fill="#ffffff" stroke="#d2deed" stroke-width="1.5"/>
<text x="485.0" y="220" class="zh" text-anchor="middle">执行当前任务项</text>
<text x="485.0" y="247" class="en" text-anchor="middle">Execute the current item</text>
<path d="M615 230 H665" class="line"/>
<rect x="665" y="185" width="260" height="90" rx="16" fill="#ffffff" stroke="#d2deed" stroke-width="1.5"/>
<text x="795.0" y="220" class="zh" text-anchor="middle">提交结果与证据</text>
<text x="795.0" y="247" class="en" text-anchor="middle">Submit result + evidence</text>
<path d="M795 275 V350" class="line"/>
<rect x="665" y="350" width="260" height="100" rx="16" fill="#e9f1ff" stroke="#9fbaec" stroke-width="1.5"/>
<text x="795.0" y="385" class="zh" text-anchor="middle">Laya / Jev 逐项验收</text>
<text x="795.0" y="412" class="en" text-anchor="middle">Independent item review</text>
<path d="M665 400 H615" class="line"/>
<text x="640" y="379" class="label" text-anchor="middle">通过 / Pass</text>
<rect x="355" y="350" width="260" height="100" rx="16" fill="#eaf7f2" stroke="#90c8b5" stroke-width="1.5"/>
<text x="485.0" y="385" class="zh" text-anchor="middle">保留本项通过记录</text>
<text x="485.0" y="412" class="en" text-anchor="middle">Preserve this approval</text>
<path d="M485 350 V275" class="line"/>
<text x="330" y="290" class="small" text-anchor="end">还有任务 / More items</text>
<path d="M485 450 V530" class="line"/>
<text x="502" y="493" class="small" text-anchor="start">全部项通过 / All items pass</text>
<rect x="355" y="530" width="260" height="106" rx="16" fill="#e9f1ff" stroke="#9fbaec" stroke-width="1.5"/>
<text x="485.0" y="565" class="zh" text-anchor="middle">原始需求与整体验收</text>
<text x="485.0" y="592" class="en" text-anchor="middle">Review the original goal</text>
<path d="M615 583 H665" class="line"/>
<rect x="665" y="530" width="260" height="106" rx="16" fill="#eaf7f2" stroke="#90c8b5" stroke-width="1.5"/>
<text x="795.0" y="565" class="zh" text-anchor="middle">完成并给出评估</text>
<text x="795.0" y="592" class="en" text-anchor="middle">Complete with review results</text>
<path d="M925 400 H975" class="line"/>
<rect x="975" y="350" width="180" height="100" rx="16" fill="#fff6e8" stroke="#e9c48b" stroke-width="1.5"/>
<text x="1065.0" y="385" class="zh" text-anchor="middle">定向修复</text>
<text x="1065.0" y="412" class="en" text-anchor="middle">Targeted repair</text>
<text x="975" y="324" class="small" text-anchor="end">未通过 / Gap</text>
<path d="M1065 350 V145 H485 V185" class="line"/>
<path d="M355 583 H185 V308 H485 V275" class="line"/>
<text x="70" y="490" class="label" text-anchor="start">整体有缺口</text>
<text x="70" y="516" class="en" text-anchor="start">Overall gap</text>
<text x="48" y="698" class="small" text-anchor="start">修复受影响项，复验追加记录 · Repair affected items; append revalidation records</text>
<text x="48" y="733" class="small" text-anchor="start">验收不可用、超预算或连续无进展 → 暂停 / 阻塞，修复后由用户继续</text>
<text x="48" y="760" class="note" text-anchor="start">Reviewer unavailable, budget reached, or repeated no progress → pause / block; user resumes</text>
<text x="48" y="795" class="note" text-anchor="start">流程示意，非界面截图 · Workflow illustration, not a screenshot</text>
</svg>
