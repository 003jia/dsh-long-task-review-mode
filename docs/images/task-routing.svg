<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#162b43}.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657b}.zh{font-size:23px;font-weight:600}.en{font-size:17px;fill:#405b76}.small{font-size:17px;fill:#52657b}.label{font-size:18px;font-weight:600}.line{fill:none;stroke:#52657b;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round}.note{font-size:16px;fill:#52657b}</style>
<rect width="1200" height="820" rx="24" fill="#f5f8fc"/>
<title id="title">长任务三路分流 / Three task routes</title><desc id="desc">先判断是否代码任务，再按独立验收开关选择执行路径。Classify code involvement, then apply the saved review policy.</desc>
<text x="48" y="60" class="title" text-anchor="start">01 / 按任务分流 · Route by request</text>
<text x="48" y="94" class="subtitle" text-anchor="start">DSH Long Task Review Mode  ·  v0.2.3</text>
<rect x="400" y="125" width="400" height="78" rx="16" fill="#ffffff" stroke="#d2deed" stroke-width="1.5"/>
<text x="600.0" y="160" class="zh" text-anchor="middle">选择长任务模式并发送需求</text>
<text x="600.0" y="187" class="en" text-anchor="middle">Select Long Task Mode, then send</text>
<path d="M600 203 V232" class="line"/>
<rect x="400" y="232" width="400" height="84" rx="16" fill="#e9f1ff" stroke="#9fbaec" stroke-width="1.5"/>
<text x="600.0" y="267" class="zh" text-anchor="middle">是否涉及代码？</text>
<text x="600.0" y="294" class="en" text-anchor="middle">Does the request involve code?</text>
<path d="M400 274 H210 V485" class="line"/>
<text x="255" y="352" class="label" text-anchor="middle">否 / No</text>
<path d="M800 274 H870 V355" class="line"/>
<text x="910" y="325" class="label" text-anchor="middle">是 / Yes</text>
<rect x="680" y="355" width="380" height="78" rx="16" fill="#e9f1ff" stroke="#9fbaec" stroke-width="1.5"/>
<text x="870.0" y="390" class="zh" text-anchor="middle">独立验收是否开启？</text>
<text x="870.0" y="417" class="en" text-anchor="middle">Is independent review enabled?</text>
<path d="M780 433 V455 H600 V485" class="line"/>
<text x="635" y="455" class="label" text-anchor="middle">关 / Off</text>
<path d="M965 433 V485" class="line"/>
<text x="1060" y="468" class="label" text-anchor="middle">开 / On</text>
<rect x="40" y="485" width="340" height="220" rx="16" fill="#ffffff" stroke="#d2deed" stroke-width="1.5"/>
<text x="210.0" y="520" class="zh" text-anchor="middle">非代码任务</text>
<text x="210.0" y="547" class="en" text-anchor="middle">Non-code request</text>
<text x="210" y="581" class="zh" text-anchor="middle">正常分析 · 按需工具</text>
<text x="210" y="613" class="en" text-anchor="middle">Analyze · tools as needed</text>
<text x="210" y="656" class="small" text-anchor="middle">直接回答 / Normal answer</text>
<rect x="430" y="485" width="340" height="220" rx="16" fill="#fff6e8" stroke="#e9c48b" stroke-width="1.5"/>
<text x="600.0" y="520" class="zh" text-anchor="middle">主模型自检</text>
<text x="600.0" y="547" class="en" text-anchor="middle">Primary-model self-review</text>
<text x="600" y="581" class="zh" text-anchor="middle">普通计划 → 执行 → 自检</text>
<text x="600" y="613" class="en" text-anchor="middle">Plan → execute → self-review</text>
<text x="600" y="656" class="small" text-anchor="middle">明确标注自检 / Labeled self-review</text>
<rect x="820" y="485" width="340" height="220" rx="16" fill="#eaf7f2" stroke="#90c8b5" stroke-width="1.5"/>
<text x="990.0" y="520" class="zh" text-anchor="middle">独立模型验收</text>
<text x="990.0" y="547" class="en" text-anchor="middle">Independent model review</text>
<text x="990" y="581" class="zh" text-anchor="middle">plan.md → 证据 → 验收</text>
<text x="990" y="613" class="en" text-anchor="middle">Plan → evidence → Laya / Jev</text>
<text x="990" y="656" class="small" text-anchor="middle">逐项 + 整体 / Item + overall</text>
<text x="48" y="754" class="small" text-anchor="start">已有任务保留分流与通过记录 · Active jobs keep their route and approvals</text>
<text x="48" y="785" class="note" text-anchor="start">流程示意，非界面截图 · Workflow illustration, not a screenshot</text>
</svg>
